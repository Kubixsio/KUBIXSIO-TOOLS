name: Build guide v60

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/build-guide-v60.yml"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build high-res guide and v60
        shell: bash
        run: |
          set -e
          cat .guide_parts/*.txt | base64 -d > obrobkaporadnik.jpg

          python - <<'PY'
          from pathlib import Path
          p = Path("obrobkaporadnik.jpg")
          b = p.read_bytes()
          assert b[:2] == b"\xff\xd8", "Missing JPEG SOI"
          assert b[-2:] == b"\xff\xd9", "Missing JPEG EOI"
          assert len(b) > 50000, f"JPEG unexpectedly small: {len(b)}"
          print("JPEG OK", len(b))
          PY

          sed -i 's/?v=59/?v=60/g; s/• v59/• v60/g' plugin.html

          rm -rf .guide_parts
          rm -f .github/workflows/build-guide-v60.yml

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Finalize high-res guide and v60"
          git push
