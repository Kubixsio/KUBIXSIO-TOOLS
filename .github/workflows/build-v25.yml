name: Build v25

on:
  push:
    paths:
      - 'v25.html.gz.b64'
      - '.github/workflows/build-v25.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build v25 files
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import base64, gzip, re

          html_payload = ''.join(Path('v25.html.gz.b64').read_text().split())
          Path('v25.html').write_bytes(gzip.decompress(base64.b64decode(html_payload)))

          chunks = []
          for i in range(1, 6):
              text = Path(f'watermark-part{i}.txt').read_text()
              clean = re.sub(r'[^A-Za-z0-9+/=]', '', text)
              chunks.append(base64.b64decode(clean, validate=False))
          Path('watermark-v25.png').write_bytes(b''.join(chunks))
          Path('version.txt').write_text('v25.html\n')
          PY
          echo 'bb60f5a14334966b2effca5e9d792809ba85b40b7f8a2b3952ad66e3be27f2ac  watermark-v25.png' | sha256sum -c -

      - name: Commit v25
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add v25.html watermark-v25.png version.txt
          if ! git diff --cached --quiet; then
            git commit -m 'Build v25 ArrayBuffer watermark importer'
            git push
          fi
