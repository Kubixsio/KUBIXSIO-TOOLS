name: Build watermark PNG

on:
  push:
    paths:
      - '.github/workflows/build-watermark.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Pillow
        run: python -m pip install --quiet pillow
      - name: Convert embedded watermark to RGBA PNG
        run: |
          python - <<'PY'
          import re, base64
          from io import BytesIO
          from PIL import Image
          from pathlib import Path

          svg = Path('watermark.svg').read_text(encoding='utf-8')
          m = re.search(r'data:image/png;base64,([^"\']+)', svg)
          if not m:
              raise SystemExit('No embedded PNG found in watermark.svg')

          src = Image.open(BytesIO(base64.b64decode(m.group(1)))).convert('RGBA')
          canvas = Image.new('RGBA', (1920,1080), (0,0,0,0))
          canvas.alpha_composite(src, (1393,677))
          canvas.save('watermark.png')
          print(src.mode, src.size)
          print('saved watermark.png', canvas.size)
          PY
      - name: Commit PNG
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add watermark.png
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Build RGBA watermark PNG"
            git push
          fi
