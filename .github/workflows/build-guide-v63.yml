name: Build guide v63

on:
  push:
    paths:
      - '.github/workflows/build-guide-v63.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Pillow
        run: python -m pip install --quiet pillow

      - name: Build HQ guide and patch plugin
        shell: python
        run: |
          from pathlib import Path
          from PIL import Image, ImageFilter

          src = Image.open('obrobkaporadnik.jpg').convert('RGB')
          target = src.resize((2400, 1500), Image.Resampling.LANCZOS)
          target = target.filter(ImageFilter.UnsharpMask(radius=1.15, percent=130, threshold=2))
          target.save('obrobkaporadnik-hq.webp', 'WEBP', quality=95, method=6)

          p = Path('plugin.html')
          s = p.read_text(encoding='utf-8')
          s = s.replace('?v=62', '?v=63').replace('• v62', '• v63')
          s = s.replace('obrobkaporadnik.jpg?v=63', 'obrobkaporadnik-hq.webp?v=63')
          s = s.replace(
              '.guide-lightbox{position:fixed;inset:0;z-index:99999;display:none;overflow:hidden;background:rgba(5,8,13,.97);backdrop-filter:blur(4px)}',
              '.guide-lightbox{position:fixed;inset:0;width:100%;height:100%;z-index:99999;display:none;overflow:hidden;background:rgba(5,8,13,.97);backdrop-filter:blur(4px);box-sizing:border-box}'
          )
          old_close = '.guide-close{position:fixed;top:10px;right:10px;z-index:100000;width:38px;height:38px;border:1px solid rgba(255,255,255,.20);border-radius:10px;background:rgba(20,24,31,.82);color:#fff;font-size:26px;line-height:32px;padding:0;cursor:pointer;backdrop-filter:blur(6px)}'
          new_close = '.guide-close{position:fixed;top:14px;right:14px;z-index:100000;width:42px;height:42px;display:flex;align-items:center;justify-content:center;box-sizing:border-box;border:1px solid rgba(255,255,255,.20);border-radius:10px;background:rgba(20,24,31,.88);color:#fff;font-family:Arial,sans-serif;font-size:30px;font-weight:400;line-height:1;padding:0;margin:0;cursor:pointer;backdrop-filter:blur(6px);overflow:hidden}'
          s = s.replace(old_close, new_close)
          s = s.replace('body.guide-open{overflow:hidden}', 'html.guide-open,body.guide-open{overflow:hidden!important;width:100%!important;height:100%!important}')
          s = s.replace("document.body.classList.add('guide-open');", "document.body.classList.add('guide-open');document.documentElement.classList.add('guide-open');")
          s = s.replace("document.body.classList.remove('guide-open');", "document.body.classList.remove('guide-open');document.documentElement.classList.remove('guide-open');")
          p.write_text(s, encoding='utf-8')

      - name: Clean temporary guide build files
        run: |
          rm -rf .guide_parts
          rm -f .github/workflows/build-guide-v63.yml

      - name: Commit v63
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Improve guide quality and lightbox controls v63"
          git push
