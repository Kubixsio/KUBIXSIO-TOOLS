name: Finalize guide v65

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/finalize-v65.yml'

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Pillow
        run: python -m pip install --quiet pillow

      - name: Restore original-quality PNG and patch v65
        shell: python
        run: |
          from pathlib import Path
          from PIL import Image
          import hashlib

          src = Image.open('.v65-source.webp').convert('RGB')
          assert src.size == (1600, 1000), src.size
          pixel_hash = hashlib.sha256(src.tobytes()).hexdigest()
          expected = 'aa8b92dd419b8e7ae1ad1ce993e5cabecec3adfd65775215433832a1f67b8098'
          assert pixel_hash == expected, (pixel_hash, expected)

          src.save('obrobkaporadnik-full.png', 'PNG', optimize=False, compress_level=6)

          check = Image.open('obrobkaporadnik-full.png').convert('RGB')
          assert check.size == (1600, 1000)
          assert hashlib.sha256(check.tobytes()).hexdigest() == expected

          p = Path('plugin.html')
          s = p.read_text(encoding='utf-8')
          assert 'KUBIXSIO TOOLS • v65' in s
          assert 'data-full-src="obrobkaporadnik-full.png?v=65"' in s
          p.write_text(s, encoding='utf-8')

      - name: Clean temporary files
        run: |
          rm -f .v65-source.webp
          rm -f .github/workflows/finalize-v65.yml

      - name: Commit final v65
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Use original-quality PNG guide in v65"
          git push
