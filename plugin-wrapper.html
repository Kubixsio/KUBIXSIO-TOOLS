<!doctype html><html lang="pl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>KUBIXSIO TOOLS</title><style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#15171b}iframe{display:block;width:100%;height:100%;border:0}</style></head><body><iframe id="plugin" src="plugin.html?t=1"></iframe><script>const frame=document.getElementById('plugin');window.addEventListener('message',function(e){if(e.source===frame.contentWindow){window.parent.postMessage(e.data,'*')}else{frame.contentWindow.postMessage(e.data,'*')}});frame.addEventListener('load',function(){try{const d=frame.contentDocument;const foot=d.querySelector('.footer');if(foot)foot.textContent='KUBIXSIO TOOLS • v35';const s=d.createElement('script');s.textContent=`runNoise=function(){const controls=document.getElementById('noiseControls');const button=document.getElementById('noiseButton');if(controls)controls.classList.remove('open');if(button)button.setAttribute('aria-expanded','false');setStatus('Dodaję SZUM...','busy');postScript('try{var doc=app.activeDocument;if(!doc)throw new Error("Brak otwartego dokumentu");var noiseInfo=null;function scanNoise(layers,parentGroup){for(var i=0;i<layers.length;i++){var L=layers[i];if(!noiseInfo&&L&&L.name==="SZUM"){noiseInfo={below:null,above:null,parent:parentGroup||null};if(i<layers.length-1)noiseInfo.below=layers[i+1];if(i>0)noiseInfo.above=layers[i-1]}try{if(L.layers)scanNoise(L.layers,L)}catch(e){}}}function removeNoise(layers){for(var i=layers.length-1;i>=0;i--){var L=layers[i];try{if(L.layers)removeNoise(L.layers)}catch(e){}if(L&&L.name==="SZUM"){try{L.remove()}catch(e){}}}}scanNoise(doc.layers,null);removeNoise(doc.layers);doc.selection.selectAll();doc.selection.copy(true);var layer=doc.paste();doc.selection.deselect();layer.name="SZUM";doc.activeLayer=layer;var d=new ActionDescriptor();d.putEnumerated(charIDToTypeID("Dstr"),charIDToTypeID("Dstr"),charIDToTypeID("Unfr"));d.putUnitDouble(charIDToTypeID("Nose"),charIDToTypeID("#Prc"),'+noiseAmount+');d.putBoolean(charIDToTypeID("Mnch"),false);d.putInteger(charIDToTypeID("FlRs"),Math.floor(Math.random()*2147483647));executeAction(charIDToTypeID("AdNs"),d,DialogModes.NO);if(noiseInfo){try{if(noiseInfo.below)layer.move(noiseInfo.below,ElementPlacement.PLACEBEFORE);else if(noiseInfo.above)layer.move(noiseInfo.above,ElementPlacement.PLACEAFTER);else if(noiseInfo.parent)layer.move(noiseInfo.parent,ElementPlacement.INSIDE)}catch(e){}}layer.opacity='+noiseOpacity+';doc.activeLayer=layer;app.echoToOE("KTX_OK|Szum gotowy ('+noiseAmount+'% / '+noiseOpacity+'%)")}catch(e){app.echoToOE("KTX_ERR|SZUM|"+e.toString())}')}`;d.body.appendChild(s)}catch(e){console.error(e)}});</script></body></html>
