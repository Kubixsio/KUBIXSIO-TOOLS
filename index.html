<!doctype html>
<html lang="pl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>KUBIXSIO TOOLS DEBUG</title>
  <style>
    :root{
      color-scheme: dark;
      --bg:#15171b; --panel:#1d2026; --panel2:#252932; --text:#f3f5f7;
      --muted:#9aa3ad; --border:#343a46; --accent:#686cff; --accent2:#8d74ff;
      --ok:#79d69a; --warn:#f1c66d; --bad:#ff7474;
    }
    *{box-sizing:border-box}
    html,body{margin:0;min-height:100%;background:var(--bg);font-family:Arial,Helvetica,sans-serif;color:var(--text)}
    body{padding:14px}
    .wrap{max-width:430px;margin:0 auto}
    .head{display:flex;align-items:center;gap:11px;margin-bottom:14px}
    .logo{
      width:42px;height:42px;border-radius:11px;background:linear-gradient(135deg,var(--accent),var(--accent2));
      display:grid;place-items:center;font-weight:900;font-size:18px;box-shadow:0 5px 18px #0006
    }
    h1{font-size:19px;margin:0;letter-spacing:.5px}
    .sub{font-size:12px;color:#aeb7c2;margin-top:3px}
    .section{background:var(--panel);border:1px solid var(--border);border-radius:13px;padding:13px;margin-bottom:11px}
    .section-title{font-size:11px;font-weight:800;letter-spacing:1.1px;color:#aeb7c2;margin:0 0 10px}
    .grid{display:grid;grid-template-columns:1fr;gap:9px}
    button{
      width:100%;border:1px solid var(--border);background:var(--panel2);color:var(--text);
      border-radius:10px;padding:12px 13px;font-size:14px;font-weight:800;cursor:pointer;text-align:left;
      transition:.12s ease;
    }
    button:hover{border-color:#7076ff;background:#292e38}
    button .hint{display:block;font-weight:400;color:var(--muted);font-size:10px;margin-top:5px}
    .secondary{font-size:12px;padding:9px 11px}
    .status{display:flex;align-items:center;gap:8px;color:var(--muted);font-size:11px;padding:4px 3px 0}
    .dot{width:8px;height:8px;border-radius:50%;background:var(--ok);flex:none}
    .dot.busy{background:var(--warn)}
    .dot.err{background:var(--bad)}
    .debug{
      margin-top:8px;background:#0e1013;border:1px solid var(--border);border-radius:9px;
      padding:9px;min-height:90px;max-height:190px;overflow:auto;white-space:pre-wrap;
      font:10px/1.45 Consolas,monospace;color:#cbd3dc;
    }
    .footer{font-size:9px;color:#6f7883;text-align:center;margin-top:11px}
  </style>
</head>
<body>
<div class="wrap">
  <div class="head">
    <div class="logo">K</div>
    <div>
      <h1>KUBIXSIO TOOLS</h1>
      <div class="sub">wersja diagnostyczna</div>
    </div>
  </div>

  <div class="section">
    <div class="section-title">POSTAĆ</div>
    <div class="grid">
      <button onclick="runCharacterAuto()">
        ✦ AUTO OBRÓBKA POSTACI
        <span class="hint">Uruchamia POSTAĆ - AUTO z zestawu Kubixsio</span>
      </button>
      <button class="secondary" onclick="loadATN()">
        ↻ WCZYTAJ KUBIXSIO.ATN
        <span class="hint">Tylko do testu, jeśli operacji nie ma</span>
      </button>
    </div>
  </div>

  <div class="section">
    <div class="section-title">EFEKTY FINALNE</div>
    <div class="grid">
      <button onclick="runBloom()">✨ BLOOM</button>
      <button onclick="runSharpen()">◈ SHARPEN</button>
    </div>
  </div>

  <div class="status">
    <span id="dot" class="dot"></span>
    <span id="status">Panel gotowy</span>
  </div>

  <div id="debug" class="debug">DEBUG START
</div>

  <div class="footer">KUBIXSIO TOOLS • DEBUG</div>
</div>

<script>
  const ATN_URL = "./Kubixsio.atn";
  let waitingForATN = false;

  function log(msg) {
    const box = document.getElementById("debug");
    const time = new Date().toLocaleTimeString();
    box.textContent += "[" + time + "] " + msg + "\n";
    box.scrollTop = box.scrollHeight;
  }

  function setStatus(text, mode) {
    document.getElementById("status").textContent = text;
    document.getElementById("dot").className = "dot" + (mode ? " " + mode : "");
    log("STATUS: " + text);
  }

  function sendScript(script, label) {
    setStatus("Uruchamiam: " + label + "...", "busy");
    log("Wysyłam skrypt do Photopea: " + label);
    window.parent.postMessage(script, "*");
  }

  function runCharacterAuto() {
    const script = `
      try {
        var d = app.activeDocument;
        var n = "(brak aktywnej warstwy)";
        try { n = d.activeLayer.name; } catch(x) {}
        app.echoToOE("KTX_INFO|ACTIVE|" + n);

        app.doAction("POSTAĆ - AUTO", "Kubixsio");
        app.echoToOE("KTX_OK|AUTO");
      }
      catch(e) {
        app.echoToOE("KTX_ERR|AUTO|" + e.toString());
      }
    `;
    sendScript(script, "AUTO OBRÓBKA POSTACI");
  }

  async function loadATN() {
    try {
      setStatus("Pobieram Kubixsio.atn...", "busy");
      log("ATN URL: " + ATN_URL);
      const response = await fetch(ATN_URL, {cache:"no-store"});
      log("HTTP ATN: " + response.status + " " + response.statusText);
      if (!response.ok) throw new Error("HTTP " + response.status);

      const buffer = await response.arrayBuffer();
      log("ATN pobrany, bajtów: " + buffer.byteLength);
      waitingForATN = true;
      window.parent.postMessage(buffer, "*");
      log("ATN wysłany do Photopea jako ArrayBuffer");
    }
    catch(e) {
      waitingForATN = false;
      setStatus("Błąd wczytywania ATN", "err");
      log("BŁĄD ATN: " + e.toString());
    }
  }

  function runBloom() {
    const script = `
      try {
        var doc = app.activeDocument;
        doc.selection.selectAll();
        doc.selection.copy(true);
        var layer = doc.paste();
        layer.name = "BLOOM";
        doc.selection.deselect();
        layer.applyGaussianBlur(10);
        layer.blendMode = BlendMode.SCREEN;
        layer.opacity = 20;
        app.echoToOE("KTX_OK|BLOOM");
      } catch(e) {
        app.echoToOE("KTX_ERR|BLOOM|" + e.toString());
      }
    `;
    sendScript(script, "BLOOM");
  }

  function runSharpen() {
    const script = `
      try {
        var doc = app.activeDocument;
        doc.selection.selectAll();
        doc.selection.copy(true);
        var layer = doc.paste();
        layer.name = "SHARPEN";
        doc.selection.deselect();
        layer.applyHighPass(2);
        layer.blendMode = BlendMode.OVERLAY;
        layer.opacity = 55;
        app.echoToOE("KTX_OK|SHARPEN");
      } catch(e) {
        app.echoToOE("KTX_ERR|SHARPEN|" + e.toString());
      }
    `;
    sendScript(script, "SHARPEN");
  }

  window.addEventListener("message", function(e) {
    const data = e.data;

    if (data === "done") {
      log('Photopea -> "done"' + (waitingForATN ? " (po wysłaniu ATN)" : ""));
      if (waitingForATN) {
        waitingForATN = false;
        setStatus("ATN wysłany / Photopea zakończyła obsługę", "");
      }
      return;
    }

    if (typeof data !== "string") {
      log("Photopea -> dane binarne / inny typ");
      return;
    }

    log("Photopea -> " + data);

    if (data.indexOf("KTX_INFO|ACTIVE|") === 0) {
      setStatus("Aktywna warstwa: " + data.substring("KTX_INFO|ACTIVE|".length), "");
      return;
    }

    if (data === "KTX_OK|AUTO") {
      setStatus("Auto obróbka gotowa", "");
      return;
    }

    if (data === "KTX_OK|BLOOM") {
      setStatus("Bloom gotowy", "");
      return;
    }

    if (data === "KTX_OK|SHARPEN") {
      setStatus("Sharpen gotowy", "");
      return;
    }

    if (data.indexOf("KTX_ERR|") === 0) {
      setStatus("Błąd — patrz DEBUG", "err");
    }
  });
</script>
</body>
</html>
