<!doctype html>
<html lang="pl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>KUBIXSIO TOOLS</title>
  <style>
    html,body{margin:0;min-height:100%;background:#15171b;color:#f3f5f7;font-family:Arial,Helvetica,sans-serif}
    body{display:grid;place-items:center;padding:18px}
    .box{font-size:12px;color:#9aa3ad;text-align:center}
  </style>
</head>
<body>
  <div class="box">Ładowanie KUBIXSIO TOOLS…</div>
  <script>
    (async function(){
      try{
        const res = await fetch('./app.html?cb=' + Date.now(), {cache:'no-store'});
        if(!res.ok) throw new Error('HTTP ' + res.status);
        const html = await res.text();
        document.open();
        document.write(html);
        document.close();
      }catch(e){
        document.body.innerHTML = '<div class="box">Nie udało się załadować panelu.<br>' + String(e) + '</div>';
      }
    })();
  </script>
</body>
</html>
