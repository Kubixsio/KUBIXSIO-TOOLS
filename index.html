<!doctype html>
<html lang="pl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>KUBIXSIO TOOLS</title>
  <style>
    :root{
      color-scheme: dark;
      --bg:#15171b; --panel:#1d2026; --panel2:#252932; --text:#f3f5f7;
      --muted:#9aa3ad; --border:#343a46; --accent:#686cff; --accent2:#8d74ff;
      --ok:#79d69a; --warn:#f1c66d; --bad:#ff7474;
    }
    *{box-sizing:border-box}
    html,body{margin:0;min-height:100%;background:var(--bg);font-family:Arial,Helvetica,sans-serif;color:var(--text)}
    body{padding:14px}
    .wrap{max-width:430px;margin:0 auto}
    .head{display:flex;align-items:center;gap:11px;margin-bottom:14px}
    .logo{
      width:42px;height:42px;border-radius:11px;background:linear-gradient(135deg,var(--accent),var(--accent2));
      display:grid;place-items:center;font-weight:900;font-size:18px;box-shadow:0 5px 18px #0006
    }
    h1{font-size:19px;margin:0;letter-spacing:.5px}
    .sub{font-size:12px;color:#aeb7c2;margin-top:3px}
    .section{background:var(--panel);border:1px solid var(--border);border-radius:13px;padding:13px;margin-bottom:11px}
    .section-title{font-size:11px;font-weight:800;letter-spacing:1.1px;color:#aeb7c2;margin:0 0 10px}
    .grid{display:grid;grid-template-columns:1fr;gap:9px}
    button{
      width:100%;border:1px solid var(--border);background:var(--panel2);color:var(--text);
      border-radius:10px;padding:12px 13px;font-size:14px;font-weight:800;cursor:pointer;text-align:left;
      transition:.12s ease;
    }
    button:hover{border-color:#7076ff;transform:translateY(-1px);background:#292e38}
    button:active{transform:translateY(0)}
    button:disabled{opacity:.55;cursor:wait;transform:none}
    button .hint{display:block;font-weight:400;color:var(--muted);font-size:10px;margin-top:5px}
    .status{
      display:flex;align-items:center;gap:8px;color:var(--muted);font-size:11px;padding:4px 3px 0
    }
    .dot{width:8px;height:8px;border-radius:50%;background:var(--ok);flex:none}
    .dot.busy{background:var(--warn)}
    .dot.err{background:var(--bad)}
    .footer{font-size:9px;color:#6f7883;text-align:center;margin-top:11px}
  </style>
</head>
<body>
<div class="wrap">
  <div class="head">
    <div class="logo">K</div>
    <div>
      <h1>KUBIXSIO TOOLS</h1>
      <div class="sub">Szybkie narzędzia do Photopea</div>
    </div>
  </div>

  <div class="section">
    <div class="section-title">POSTAĆ</div>
    <div class="grid">
      <button id="autoBtn" onclick="runCharacterAuto()">
        ✦ AUTO OBRÓBKA POSTACI
        <span class="hint">Camera Raw • krawędzie • Linear Dodge • maska</span>
      </button>
    </div>
  </div>

  <div class="section">
    <div class="section-title">EFEKTY FINALNE</div>
    <div class="grid">
      <button onclick="runBloom()">
        ✨ BLOOM
        <span class="hint">Scalona kopia • Gaussian Blur 10 px • Screen 20%</span>
      </button>

      <button onclick="runSharpen()">
        ◈ SHARPEN
        <span class="hint">Scalona kopia • High Pass 2 px • Overlay 55%</span>
      </button>
    </div>
  </div>

  <div class="status">
    <span id="dot" class="dot"></span>
    <span id="status">Panel gotowy</span>
  </div>

  <div class="footer">KUBIXSIO TOOLS • v2</div>
</div>

<script>
  const ATN_URL = "./Kubixsio.atn";
  let waitingForATN = false;

  function setStatus(text, mode) {
    document.getElementById("status").textContent = text;
    const dot = document.getElementById("dot");
    dot.className = "dot" + (mode ? " " + mode : "");
  }

  function sendScript(script, label) {
    setStatus("Uruchamiam: " + label + "...", "busy");
    window.parent.postMessage(script, "*");
  }

  function autoActionScript() {
    return `
      try {
        app.doAction("POSTAĆ - AUTO", "Kubixsio");
        app.echoToOE("KTX_OK|AUTO");
      }
      catch(e) {
        app.echoToOE("KTX_MISSING|AUTO");
      }
    `;
  }

  async function loadATNAndRetry() {
    try {
      setStatus("Wczytuję obróbkę postaci...", "busy");
      document.getElementById("autoBtn").disabled = true;

      const response = await fetch(ATN_URL, {cache:"no-store"});
      if (!response.ok) throw new Error("Nie udało się pobrać Kubixsio.atn");

      const buffer = await response.arrayBuffer();
      waitingForATN = true;
      window.parent.postMessage(buffer, "*");
    }
    catch(e) {
      waitingForATN = false;
      document.getElementById("autoBtn").disabled = false;
      setStatus("Błąd wczytywania Kubixsio.atn", "err");
    }
  }

  function runCharacterAuto() {
    sendScript(autoActionScript(), "AUTO OBRÓBKA POSTACI");
  }

  function runBloom() {
    const script = `
      try {
        var doc = app.activeDocument;
        doc.selection.selectAll();
        doc.selection.copy(true);
        var layer = doc.paste();
        layer.name = "BLOOM";
        doc.selection.deselect();
        layer.applyGaussianBlur(10);
        layer.blendMode = BlendMode.SCREEN;
        layer.opacity = 20;
        app.echoToOE("KTX_OK|BLOOM");
      }
      catch(e) {
        app.echoToOE("KTX_ERR|BLOOM");
      }
    `;
    sendScript(script, "BLOOM");
  }

  function runSharpen() {
    const script = `
      try {
        var doc = app.activeDocument;
        doc.selection.selectAll();
        doc.selection.copy(true);
        var layer = doc.paste();
        layer.name = "SHARPEN";
        doc.selection.deselect();
        layer.applyHighPass(2);
        layer.blendMode = BlendMode.OVERLAY;
        layer.opacity = 55;
        app.echoToOE("KTX_OK|SHARPEN");
      }
      catch(e) {
        app.echoToOE("KTX_ERR|SHARPEN");
      }
    `;
    sendScript(script, "SHARPEN");
  }

  window.addEventListener("message", function(e) {
    const data = e.data;

    // ATN file has just finished loading - retry the action automatically.
    if (data === "done" && waitingForATN) {
      waitingForATN = false;
      document.getElementById("autoBtn").disabled = false;
      setStatus("Operacja wczytana — uruchamiam...", "busy");
      window.parent.postMessage(autoActionScript(), "*");
      return;
    }

    if (typeof data !== "string") return;

    if (data === "KTX_MISSING|AUTO") {
      loadATNAndRetry();
      return;
    }

    if (data.indexOf("KTX_OK|") === 0) {
      document.getElementById("autoBtn").disabled = false;
      const name = data.split("|")[1];
      const labels = {
        AUTO: "Auto obróbka gotowa",
        BLOOM: "Bloom gotowy",
        SHARPEN: "Sharpen gotowy"
      };
      setStatus(labels[name] || "Gotowe", "");
      return;
    }

    if (data.indexOf("KTX_ERR|") === 0) {
      document.getElementById("autoBtn").disabled = false;
      setStatus("Coś poszło nie tak", "err");
    }
  });
</script>
</body>
</html>
