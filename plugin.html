<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <title>KUBIXSIO TOOLS</title>
  <style>
    :root{color-scheme:dark;--bg:#15171b;--panel:#1d2026;--panel2:#252932;--text:#f3f5f7;--muted:#9aa3ad;--border:#343a46;--accent:#686cff;--accent2:#8d74ff;--ok:#79d69a;--warn:#f1c66d;--bad:#ff7474}
    *{box-sizing:border-box}
    html,body{margin:0;min-height:100%;background:var(--bg);font-family:Arial,Helvetica,sans-serif;color:var(--text)}
    body{padding:14px}
    .wrap{max-width:430px;margin:0 auto}
    .head{display:flex;align-items:center;gap:11px;margin-bottom:14px}
    .logo{width:42px;height:42px;border-radius:11px;background:linear-gradient(135deg,var(--accent),var(--accent2));display:grid;place-items:center;font-weight:900;font-size:18px;box-shadow:0 5px 18px #0006}
    h1{font-size:19px;margin:0;letter-spacing:.5px}
    .sub{font-size:12px;color:#aeb7c2;margin-top:3px}
    .section{background:var(--panel);border:1px solid var(--border);border-radius:13px;padding:13px;margin-bottom:11px}
    .section-title{font-size:11px;font-weight:800;letter-spacing:1.1px;color:#aeb7c2;margin:0 0 10px}
    .grid{display:grid;grid-template-columns:1fr;gap:9px}
    button{width:100%;border:1px solid var(--border);background:var(--panel2);color:var(--text);border-radius:10px;padding:12px 13px;font-size:14px;font-weight:800;cursor:pointer;text-align:left}
    .hint{display:block;font-weight:400;color:var(--muted);font-size:10px;margin-top:5px}
    .status{display:flex;align-items:center;gap:8px;color:var(--muted);font-size:11px;padding:4px 3px 0}
    .dot{width:8px;height:8px;border-radius:50%;background:var(--ok)}
    .dot.busy{background:var(--warn)}
    .dot.err{background:var(--bad)}
    .footer{font-size:9px;color:#6f7883;text-align:center;margin-top:11px}
  </style>
</head>
<body>
  <div class="wrap">
    <div class="head">
      <div class="logo">K</div>
      <div>
        <h1>KUBIXSIO TOOLS</h1>
        <div class="sub">Szybkie narzędzia do Photopea</div>
      </div>
    </div>
    <div class="section">
      <p class="section-title">POSTAĆ</p>
      <div class="grid">
        <button type="button" onclick="runCharacterAuto()">✦ AUTO OBRÓBKA POSTACI<span class="hint">Camera Raw • krawędzie • Linear Dodge • maska</span></button>
      </div>
    </div>
    <div class="section">
      <p class="section-title">EFEKTY FINALNE</p>
      <div class="grid">
        <button type="button" onclick="runBloom()">✨ BLOOM<span class="hint">Scalona kopia • Gaussian Blur 10 px • Screen 20%</span></button>
        <button type="button" onclick="runSharpen()">◈ SHARPEN<span class="hint">Scalona kopia • High Pass 2 px • Overlay 55%</span></button>
        <button type="button" onclick="runVignette()">◉ WINIETA<span class="hint">Nakładka SVG • 20% • moc regulujesz kryciem</span></button>
        <button type="button" onclick="runFinalLook()">◐ FINAL LOOK<span class="hint">Krzywe: 66→67 i 181→193 • grupa 70%</span></button>
        <button type="button" onclick="runNoise()">▧ SZUM<span class="hint">Add Noise 5% • krycie 80%</span></button>
      </div>
    </div>
    <div class="section">
      <p class="section-title">DODATKI</p>
      <div class="grid">
        <button type="button" onclick="runWatermark()">⌘ DODAJ WATERMARK<span class="hint">Dokładny PNG • na samą górę • 80%</span></button>
      </div>
    </div>
    <div class="status"><span id="dot" class="dot"></span><span id="status">Panel gotowy</span></div>
    <div class="footer">KUBIXSIO TOOLS • v28</div>
  </div>
  <script>
    const ATN_URL = 'https://kubixsio.github.io/KUBIXSIO-TOOLS/Kubixsio.atn';
    const VIGNETTE_URL = 'https://kubixsio.github.io/KUBIXSIO-TOOLS/vignette.svg';
    const WATERMARK_URL = 'https://kubixsio.github.io/KUBIXSIO-TOOLS/watermarkFULLHD.png';
    let atnLoaded = false;
    let vignetteStage = 'idle';
    let watermarkStage = 'idle';
    let watermarkState = null;
    let watermarkGotState = false;
    let watermarkGotPrepDone = false;

    function setStatus(t, m) {
      document.getElementById('status').textContent = t;
      document.getElementById('dot').className = 'dot' + (m ? ' ' + m : '');
    }
    function postScript(s) { window.parent.postMessage(s, '*'); }

    function runCharacterAuto() {
      setStatus('Uruchamiam obróbkę postaci...', 'busy');
      if (atnLoaded) {
        postScript('app.doAction("OBRÓBKA POSTACI", "Kubixsio");');
        return;
      }
      postScript('app.open("' + ATN_URL + '");');
      setTimeout(function () {
        atnLoaded = true;
        postScript('app.doAction("OBRÓBKA POSTACI", "Kubixsio");');
      }, 1200);
    }

    function runBloom() {
      setStatus('Tworzę BLOOM...', 'busy');
      postScript('try{var doc=app.activeDocument;doc.selection.selectAll();doc.selection.copy(true);var layer=doc.paste();layer.name="BLOOM";doc.selection.deselect();layer.applyGaussianBlur(10);layer.blendMode=BlendMode.SCREEN;layer.opacity=20;app.echoToOE("KTX_OK|Bloom gotowy")}catch(e){app.echoToOE("KTX_ERR|BLOOM|"+e.toString())}');
    }

    function runSharpen() {
      setStatus('Tworzę SHARPEN...', 'busy');
      postScript('try{var doc=app.activeDocument;doc.selection.selectAll();doc.selection.copy(true);var layer=doc.paste();layer.name="SHARPEN";doc.selection.deselect();layer.applyHighPass(2);layer.blendMode=BlendMode.OVERLAY;layer.opacity=55;app.echoToOE("KTX_OK|Sharpen gotowy")}catch(e){app.echoToOE("KTX_ERR|SHARPEN|"+e.toString())}');
    }

    function runVignette() {
      if (vignetteStage !== 'idle') return;
      vignetteStage = 'loading';
      setStatus('Wczytuję WINIETĘ...', 'busy');
      postScript('app.open("' + VIGNETTE_URL + '", null, true);');
    }

    function finishVignette() {
      vignetteStage = 'finishing';
      postScript('try{var doc=app.activeDocument;var layer=doc.activeLayer;function p(v){try{return v.as("px")}catch(e){}try{return v.value}catch(e){}return Number(v)}try{var b=layer.bounds;var lw=p(b[2])-p(b[0]);var lh=p(b[3])-p(b[1]);var dw=p(doc.width),dh=p(doc.height);if(lw>0&&lh>0){layer.resize((dw/lw)*100,(dh/lh)*100,AnchorPosition.MIDDLECENTER)}}catch(e){}layer.name="WINIETA";layer.opacity=20;app.echoToOE("KTX_OK|Winieta gotowa")}catch(e){app.echoToOE("KTX_ERR|WINIETA|"+e.toString())}');
    }

    function runFinalLook() {
      setStatus('Tworzę FINAL LOOK...', 'busy');
      postScript('try{var doc=app.activeDocument;var group=doc.layerSets.add();group.name="FINAL LOOK";group.opacity=70;var mk=new ActionDescriptor();var ref=new ActionReference();ref.putClass(charIDToTypeID("AdjL"));mk.putReference(charIDToTypeID("null"),ref);var using=new ActionDescriptor();using.putString(charIDToTypeID("Nm "),"KRZYWE");var type=new ActionDescriptor();var adjs=new ActionList();var curve=new ActionDescriptor();var ch=new ActionReference();ch.putEnumerated(charIDToTypeID("Chnl"),charIDToTypeID("Chnl"),charIDToTypeID("Cmps"));curve.putReference(charIDToTypeID("Chnl"),ch);var points=new ActionList();function point(x,y){var p=new ActionDescriptor();p.putDouble(charIDToTypeID("Hrzn"),x);p.putDouble(charIDToTypeID("Vrtc"),y);points.putObject(charIDToTypeID("Pnt "),p)}point(0,0);point(66,67);point(181,193);point(255,255);curve.putList(charIDToTypeID("Crv "),points);adjs.putObject(charIDToTypeID("CrvA"),curve);type.putList(charIDToTypeID("Adjs"),adjs);using.putObject(charIDToTypeID("Type"),charIDToTypeID("Crvs"),type);mk.putObject(charIDToTypeID("Usng"),charIDToTypeID("AdjL"),using);executeAction(charIDToTypeID("Mk "),mk,DialogModes.NO);var curves=doc.activeLayer;curves.name="KRZYWE";curves.move(group,ElementPlacement.INSIDE);app.echoToOE("KTX_OK|Final Look gotowy")}catch(e){app.echoToOE("KTX_ERR|FINALLOOK|"+e.toString())}');
    }

    function runNoise() {
      setStatus('Dodaję SZUM...', 'busy');
      postScript('try{var doc=app.activeDocument;if(!doc)throw new Error("Brak otwartego dokumentu");doc.selection.selectAll();doc.selection.copy(true);var layer=doc.paste();doc.selection.deselect();layer.name="SZUM";layer.applyAddNoise(5,NoiseDistribution.UNIFORM,false);layer.opacity=80;try{layer.move(doc,ElementPlacement.PLACEATBEGINNING)}catch(e){try{var top=doc.layers[0];if(top&&top!==layer)layer.move(top,ElementPlacement.PLACEBEFORE)}catch(e2){}}app.echoToOE("KTX_OK|Szum gotowy")}catch(e){app.echoToOE("KTX_ERR|SZUM|"+e.toString())}');
    }

    function runWatermark() {
      if (watermarkStage !== 'idle') return;
      watermarkStage = 'capturing';
      watermarkState = null;
      watermarkGotState = false;
      watermarkGotPrepDone = false;
      setStatus('Dodaję watermark...', 'busy');
      postScript('try{var doc=app.activeDocument;if(!doc)throw new Error("Brak otwartego dokumentu");var ids=[];var names=[];for(var i=0;i<doc.layers.length;i++){var L=doc.layers[i];var id=null;try{id=L.id}catch(e){}ids.push(id);names.push(L.name)}app.echoToOE("KTX_WM_STATE|"+JSON.stringify({name:doc.name,count:doc.layers.length,ids:ids,names:names}))}catch(e){app.echoToOE("KTX_ERR|WATERMARK|"+e.toString())}');
    }

    function maybeOpenWatermark() {
      if (watermarkStage !== 'capturing') return;
      if (!watermarkGotState || !watermarkGotPrepDone) return;
      watermarkStage = 'opening';
      postScript('app.open("' + WATERMARK_URL + '", null, true);');
    }

    function finishWatermark() {
      watermarkStage = 'finishing';
      const state = JSON.stringify(watermarkState);
      postScript('try{var s=' + state + ';if(!s)throw new Error("Brak stanu projektu");var doc=app.activeDocument;if(!doc)throw new Error("Brak otwartego dokumentu");if(doc.name!==s.name)throw new Error("Zmieniono dokument docelowy");function isBG(L){if(!L)return true;try{if(L.isBackgroundLayer)return true}catch(e){}return false}function hasId(id){if(id==null)return false;for(var i=0;i<s.ids.length;i++){if(s.ids[i]===id)return true}return false}var useIds=false;for(var u=0;u<s.ids.length;u++){if(s.ids[u]!=null){useIds=true;break}}if(doc.layers.length!==s.count+1)throw new Error("PNG nie dodał dokładnie jednej warstwy");var layer=null;for(var i=0;i<doc.layers.length;i++){var L=doc.layers[i];if(isBG(L))continue;var id=null;try{id=L.id}catch(e){}if(useIds){if(id!=null&&!hasId(id)){layer=L;break}} }if(!layer){function nCount(arr,n){var c=0;for(var k=0;k<arr.length;k++)if(arr[k]===n)c++;return c}var now=[];for(var t=0;t<doc.layers.length;t++)now.push(doc.layers[t].name);for(var j=0;j<doc.layers.length;j++){var cand=doc.layers[j];if(isBG(cand))continue;if(nCount(now,cand.name)>nCount(s.names,cand.name)){layer=cand;break}}}if(!layer)throw new Error("Nie znaleziono nowej warstwy WATERMARK");if(isBG(layer))throw new Error("Odrzucono warstwę Background");var remove=[];function collect(layers){for(var i=layers.length-1;i>=0;i--){var L=layers[i];if(L!==layer&&L.name==="WATERMARK"&&!isBG(L))remove.push(L);try{if(L.layers)collect(L.layers)}catch(e){}}}collect(doc.layers);for(var r=0;r<remove.length;r++)remove[r].remove();try{layer.rasterize(RasterizeType.ENTIRELAYER)}catch(e){try{layer.rasterize()}catch(e2){}}layer.name="WATERMARK";function px(v){try{return v.as("px")}catch(e){}try{return v.value}catch(e){}return Number(v)}try{var b=layer.bounds;var lw=px(b[2])-px(b[0]);var lh=px(b[3])-px(b[1]);var dw=px(doc.width),dh=px(doc.height);if(lw>0&&lh>0)layer.resize((dw/lw)*100,(dh/lh)*100,AnchorPosition.MIDDLECENTER)}catch(e){}if(isBG(layer)||layer.name!=="WATERMARK")throw new Error("WATERMARK nie został poprawnie ustawiony");layer.opacity=80;try{layer.move(doc,ElementPlacement.PLACEATBEGINNING)}catch(e){try{var top=doc.layers[0];if(top&&top!==layer)layer.move(top,ElementPlacement.PLACEBEFORE)}catch(e2){}}app.echoToOE("KTX_OK|Watermark gotowy")}catch(e){app.echoToOE("KTX_ERR|WATERMARK|"+e.toString())}');
    }

    window.addEventListener('message', function (e) {
      if (e.data === 'done') {
        if (vignetteStage === 'loading') { finishVignette(); return; }
        if (vignetteStage === 'finishing') { vignetteStage = 'idle'; setStatus('Winieta gotowa', ''); return; }
        if (watermarkStage === 'capturing') {
          watermarkGotPrepDone = true;
          maybeOpenWatermark();
          return;
        }
        if (watermarkStage === 'opening') {
          finishWatermark();
          return;
        }
        if (watermarkStage === 'finishing') return;
        if (watermarkStage !== 'idle') return;
        setStatus('Gotowe', '');
        return;
      }
      if (typeof e.data !== 'string') return;
      if (e.data.indexOf('KTX_WM_STATE|') === 0 && watermarkStage === 'capturing') {
        try {
          watermarkState = JSON.parse(e.data.substring(13));
          watermarkGotState = true;
          maybeOpenWatermark();
        } catch (err) {
          watermarkStage = 'idle';
          setStatus('Błąd — odczyt projektu', 'err');
        }
        return;
      }
      if (e.data.indexOf('KTX_OK|') === 0) {
        if (e.data.indexOf('Winieta gotowa') > 0) vignetteStage = 'idle';
        if (e.data.indexOf('Watermark gotowy') > 0) watermarkStage = 'idle';
        setStatus(e.data.substring(7), '');
        return;
      }
      if (e.data.indexOf('KTX_ERR|') === 0) {
        vignetteStage = 'idle';
        watermarkStage = 'idle';
        setStatus('Błąd — ' + e.data.substring(8), 'err');
      }
    });
  </script>
</body>
</html>
