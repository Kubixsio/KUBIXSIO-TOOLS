<!doctype html>
<html lang="pl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>KUBIXSIO TOOLS</title>
  <style>
    :root{color-scheme:dark;--bg:#15171b;--panel:#1d2026;--panel2:#252932;--text:#f3f5f7;--muted:#9aa3ad;--border:#343a46;--accent:#686cff;--accent2:#8d74ff;--ok:#79d69a;--warn:#f1c66d;--bad:#ff7474}
    *{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--bg);font-family:Arial,Helvetica,sans-serif;color:var(--text)}body{padding:14px}.wrap{max-width:430px;margin:0 auto}.head{display:flex;align-items:center;gap:11px;margin-bottom:14px}.logo{width:42px;height:42px;border-radius:11px;background:linear-gradient(135deg,var(--accent),var(--accent2));display:grid;place-items:center;font-weight:900;font-size:18px;box-shadow:0 5px 18px #0006}h1{font-size:19px;margin:0;letter-spacing:.5px}.sub{font-size:12px;color:#aeb7c2;margin-top:3px}.section{background:var(--panel);border:1px solid var(--border);border-radius:13px;padding:13px;margin-bottom:11px}.section-title{font-size:11px;font-weight:800;letter-spacing:1.1px;color:#aeb7c2;margin:0 0 10px}.grid{display:grid;grid-template-columns:1fr;gap:9px}button{width:100%;border:1px solid var(--border);background:var(--panel2);color:var(--text);border-radius:10px;padding:12px 13px;font-size:14px;font-weight:800;cursor:pointer;text-align:left;transition:.12s ease}button:hover{border-color:#7076ff;background:#292e38}.hint{display:block;font-weight:400;color:var(--muted);font-size:10px;margin-top:5px}.status{display:flex;align-items:center;gap:8px;color:var(--muted);font-size:11px;padding:4px 3px 0}.dot{width:8px;height:8px;border-radius:50%;background:var(--ok);flex:none}.dot.busy{background:var(--warn)}.dot.err{background:var(--bad)}.footer{font-size:9px;color:#6f7883;text-align:center;margin-top:11px}
  </style>
</head>
<body>
<div class="wrap">
  <div class="head"><div class="logo">K</div><div><h1>KUBIXSIO TOOLS</h1><div class="sub">Szybkie narzędzia do Photopea</div></div></div>

  <div class="section">
    <div class="section-title">POSTAĆ</div>
    <div class="grid"><button onclick="runCharacterAuto()">✦ AUTO OBRÓBKA POSTACI<span class="hint">Camera Raw • krawędzie • Linear Dodge • maska</span></button></div>
  </div>

  <div class="section">
    <div class="section-title">EFEKTY FINALNE</div>
    <div class="grid">
      <button onclick="runBloom()">✨ BLOOM<span class="hint">Scalona kopia • Gaussian Blur 10 px • Screen 20%</span></button>
      <button onclick="runSharpen()">◈ SHARPEN<span class="hint">Scalona kopia • High Pass 2 px • Overlay 55%</span></button>
      <button onclick="runVignette()">◉ WINIETA<span class="hint">Standard • 20% • moc zmieniasz kryciem warstwy</span></button>
      <button onclick="runFinalLook()">◐ FINAL LOOK<span class="hint">Twoje Krzywe • grupa 70% • maska grupy</span></button>
    </div>
  </div>

  <div class="status"><span id="dot" class="dot"></span><span id="status">Panel gotowy</span></div>
  <div class="footer">KUBIXSIO TOOLS • v8</div>
</div>
<script>
const ATN_URL='https://kubixsio.github.io/KUBIXSIO-TOOLS/Kubixsio.atn';
let atnLoaded=false;
function setStatus(t,m=''){document.getElementById('status').textContent=t;document.getElementById('dot').className='dot'+(m?' '+m:'');}
function postScript(s){window.parent.postMessage(s,'*');}

function runCharacterAuto(){
  setStatus('Uruchamiam obróbkę postaci...','busy');
  if(atnLoaded){postScript('app.doAction("OBRÓBKA POSTACI", "Kubixsio");');return;}
  postScript('app.open("'+ATN_URL+'");');
  setTimeout(function(){atnLoaded=true;postScript('app.doAction("OBRÓBKA POSTACI", "Kubixsio");');},1200);
}

function runBloom(){
  setStatus('Tworzę BLOOM...','busy');
  postScript(`
    try{
      var doc=app.activeDocument;
      doc.selection.selectAll();
      doc.selection.copy(true);
      var layer=doc.paste();
      layer.name="BLOOM";
      doc.selection.deselect();
      layer.applyGaussianBlur(10);
      layer.blendMode=BlendMode.SCREEN;
      layer.opacity=20;
      app.echoToOE("KTX_OK|Bloom gotowy");
    }catch(e){app.echoToOE("KTX_ERR|BLOOM|"+e.toString());}
  `);
}

function runSharpen(){
  setStatus('Tworzę SHARPEN...','busy');
  postScript(`
    try{
      var doc=app.activeDocument;
      doc.selection.selectAll();
      doc.selection.copy(true);
      var layer=doc.paste();
      layer.name="SHARPEN";
      doc.selection.deselect();
      layer.applyHighPass(2);
      layer.blendMode=BlendMode.OVERLAY;
      layer.opacity=55;
      app.echoToOE("KTX_OK|Sharpen gotowy");
    }catch(e){app.echoToOE("KTX_ERR|SHARPEN|"+e.toString());}
  `);
}

function runVignette(){
  setStatus('Tworzę WINIETĘ...','busy');
  postScript(`
    try{
      var doc=app.activeDocument;
      function num(v){try{return v.as("px");}catch(e){} try{return v.value;}catch(e){} return Number(v);}
      function ellipse(cx,cy,rx,ry,n){var p=[];for(var i=0;i<n;i++){var a=Math.PI*2*i/n;p.push([cx+Math.cos(a)*rx,cy+Math.sin(a)*ry]);}return p;}
      function revealAllMask(){
        var d=new ActionDescriptor();
        d.putClass(charIDToTypeID("Nw  "),charIDToTypeID("Chnl"));
        var r=new ActionReference();
        r.putEnumerated(charIDToTypeID("Chnl"),charIDToTypeID("Chnl"),charIDToTypeID("Msk "));
        d.putReference(charIDToTypeID("At  "),r);
        d.putEnumerated(charIDToTypeID("Usng"),charIDToTypeID("UsrM"),charIDToTypeID("RvlA"));
        executeAction(charIDToTypeID("Mk  "),d,DialogModes.NO);
      }
      function hideSelectionMask(){
        var d=new ActionDescriptor();
        d.putClass(charIDToTypeID("Nw  "),charIDToTypeID("Chnl"));
        var r=new ActionReference();
        r.putEnumerated(charIDToTypeID("Chnl"),charIDToTypeID("Chnl"),charIDToTypeID("Msk "));
        d.putReference(charIDToTypeID("At  "),r);
        d.putEnumerated(charIDToTypeID("Usng"),charIDToTypeID("UsrM"),charIDToTypeID("HdSl"));
        executeAction(charIDToTypeID("Mk  "),d,DialogModes.NO);
      }

      var w=num(doc.width), h=num(doc.height);
      var group=doc.layerSets.add(); group.name="WINIETA";
      var layer=doc.artLayers.add(); layer.name="STANDARD"; doc.activeLayer=layer;
      var black=new SolidColor(); black.rgb.red=0; black.rgb.green=0; black.rgb.blue=0;
      doc.selection.selectAll(); doc.selection.fill(black); doc.selection.deselect();

      var pts=ellipse(w/2,h/2,w*0.37,h*0.37,72);
      doc.selection.select(pts,SelectionType.REPLACE,0,true);
      doc.selection.feather(Math.round(Math.min(w,h)*0.28));
      hideSelectionMask();
      doc.selection.deselect();
      layer.opacity=20;
      layer.move(group,ElementPlacement.INSIDE);

      doc.activeLayer=group;
      revealAllMask();
      app.echoToOE("KTX_OK|Winieta gotowa");
    }catch(e){app.echoToOE("KTX_ERR|WINIETA|"+e.toString());}
  `);
}

function runFinalLook(){
  setStatus('Tworzę FINAL LOOK...','busy');
  postScript(`
    try{
      var doc=app.activeDocument;
      function revealAllMask(){
        var d=new ActionDescriptor();
        d.putClass(charIDToTypeID("Nw  "),charIDToTypeID("Chnl"));
        var r=new ActionReference();
        r.putEnumerated(charIDToTypeID("Chnl"),charIDToTypeID("Chnl"),charIDToTypeID("Msk "));
        d.putReference(charIDToTypeID("At  "),r);
        d.putEnumerated(charIDToTypeID("Usng"),charIDToTypeID("UsrM"),charIDToTypeID("RvlA"));
        executeAction(charIDToTypeID("Mk  "),d,DialogModes.NO);
      }
      var group=doc.layerSets.add(); group.name="FINAL LOOK"; group.opacity=70;

      var mk=new ActionDescriptor();
      var ref=new ActionReference(); ref.putClass(charIDToTypeID("AdjL")); mk.putReference(charIDToTypeID("null"),ref);
      var using=new ActionDescriptor(); using.putString(charIDToTypeID("Nm  "),"KRZYWE");
      var type=new ActionDescriptor();
      var adjs=new ActionList();
      var curve=new ActionDescriptor();
      var ch=new ActionReference(); ch.putEnumerated(charIDToTypeID("Chnl"),charIDToTypeID("Chnl"),charIDToTypeID("Cmps")); curve.putReference(charIDToTypeID("Chnl"),ch);
      var points=new ActionList();
      function point(x,y){var p=new ActionDescriptor();p.putDouble(charIDToTypeID("Hrzn"),x);p.putDouble(charIDToTypeID("Vrtc"),y);points.putObject(charIDToTypeID("Pnt "),p);}
      point(0,0); point(64,66); point(181,195); point(255,255);
      curve.putList(charIDToTypeID("Crv "),points);
      adjs.putObject(charIDToTypeID("CrvA"),curve);
      type.putList(charIDToTypeID("Adjs"),adjs);
      using.putObject(charIDToTypeID("Type"),charIDToTypeID("Crvs"),type);
      mk.putObject(charIDToTypeID("Usng"),charIDToTypeID("AdjL"),using);
      executeAction(charIDToTypeID("Mk  "),mk,DialogModes.NO);

      var curves=doc.activeLayer; curves.name="KRZYWE"; curves.move(group,ElementPlacement.INSIDE);
      doc.activeLayer=group; revealAllMask();
      app.echoToOE("KTX_OK|Final Look gotowy");
    }catch(e){app.echoToOE("KTX_ERR|FINALLOOK|"+e.toString());}
  `);
}

window.addEventListener('message',function(e){
  if(e.data==='done'){setStatus('Gotowe','');return;}
  if(typeof e.data!=='string')return;
  if(e.data.indexOf('KTX_OK|')===0){setStatus(e.data.substring(7),'');return;}
  if(e.data.indexOf('KTX_ERR|')===0){setStatus('Błąd — '+e.data.split('|')[1],'err');return;}
});
</script>
</body>
</html>
