&lh>0){layer.resize((dw/lw)*100,(dh/lh)*100,AnchorPosition.MIDDLECENTER)}}catch(e){}layer.name="WINIETA";layer.opacity=20;app.echoToOE("KTX_OK|Winieta gotowa")}catch(e){app.echoToOE("KTX_ERR|WINIETA|"+e.toString())}`)}function runFinalLook(){setStatus('Tworzę FINAL LOOK...','busy');postScript(`try{var doc=app.activeDocument;var group=doc.layerSets.add();group.name="FINAL LOOK";group.opacity=70;var mk=new ActionDescriptor();var ref=new ActionReference();ref.putClass(charIDToTypeID("AdjL"));mk.putReference(charIDToTypeID("null"),ref);var using=new ActionDescriptor();using.putString(charIDToTypeID("Nm  "),"KRZYWE");var type=new ActionDescriptor();var adjs=new ActionList();var curve=new ActionDescriptor();var ch=new ActionReference();ch.putEnumerated(charIDToTypeID("Chnl"),charIDToTypeID("Chnl"),charIDToTypeID("Cmps"));curve.putReference(charIDToTypeID("Chnl"),ch);var points=new ActionList();function point(x,y){var p=new ActionDescriptor();p.putDouble(charIDToTypeID("Hrzn"),x);p.putDouble(charIDToTypeID("Vrtc"),y);points.putObject(charIDToTypeID("Pnt "),p)}point(0,0);point(66,67);point(181,193);point(255,255);curve.putList(charIDToTypeID("Crv "),points);adjs.putObject(charIDToTypeID("CrvA"),curve);type.putList(charIDToTypeID("Adjs"),adjs);using.putObject(charIDToTypeID("Type"),charIDToTypeID("Crvs"),type);mk.putObject(charIDToTypeID("Usng"),charIDToTypeID("AdjL"),using);executeAction(charIDToTypeID("Mk  "),mk,DialogModes.NO);var curves=doc.activeLayer;curves.name="KRZYWE";curves.move(group,ElementPlacement.INSIDE);app.echoToOE("KTX_OK|Final Look gotowy")}catch(e){app.echoToOE("KTX_ERR|FINALLOOK|"+e.toString())}`)}function runWatermark(){if(watermarkStage!=='idle')return;watermarkStage='capturing';setStatus('Przygotowuję watermark...','busy');postScript(`try{var d=app.activeDocument;var idx=-1;for(var i=0;i<app.documents.length;i++)if(app.documents[i]===d){idx=i;break}if(idx<0)throw new Error("Brak dokumentu docelowego");app.echoToOE("KTX_WM_TARGET|"+idx+"|"+app.documents.length+"|"+d.name)}catch(e){app.echoToOE("KTX_ERR|WATERMARK|"+e.toString())}`)}
function openWatermarkDocument(){watermarkStage='loading';setStatus('Wczytuję oryginalny PNG...','busy');var raw=atob(WATERMARK_B64);var bytes=new Uint8Array(raw.length);for(var i=0;i<raw.length;i++)bytes[i]=raw.charCodeAt(i);window.parent.postMessage(bytes.buffer,'*');watermarkProbeAttempts=0;setTimeout(probeWatermark,250)}

function finishWatermark(){watermarkStage='finishing';const targetIndex=watermarkTargetIndex;const targetName=JSON.stringify(watermarkTargetName);const beforeDocs=watermarkBeforeDocs;postScript(`try{if(app.documents.length!==${beforeDocs}+1)throw new Error("Nie otwarto PNG");var wm=app.activeDocument;var idx=${targetIndex},target=app.documents[idx];if(!target||target===wm||target.name!==${targetName})throw new Error("Dokument docelowy zmienił się podczas importu");if(wm.layers.length!==1)throw new Error("PNG nie zawiera dokładnie jednej warstwy");var original=wm.layers[0];var before=target.layers.length;app.activeDocument=wm;original.duplicate(target,ElementPlacement.PLACEATBEGINNING);app.activeDocument=target;if(target.layers.length!==before+1)throw new Error("Nie utworzono dokładnie jednej warstwy");var layer=target.layers[0];if(!layer||layer===original)throw new Error("Nie znaleziono nowej warstwy na górze");layer.name="WATERMARK";layer.opacity=80;if(target.layers[0]!==layer||layer.name!=="WATERMARK"||layer.opacity!==80)throw new Error("Nie potwierdzono warstwy WATERMARK");app.activeDocument=wm;wm.close(SaveOptions.DONOTSAVECHANGES);app.activeDocument=target;app.echoToOE("KTX_OK|Watermark gotowy")}catch(e){app.echoToOE("KTX_ERR|WATERMARK|"+e.toString())}`)}
window.addEventListener('message',function(e){if(e.data==='done'){if(vignetteStage==='loading'){finishVignette();return}if(vignetteStage==='finishing'){vignetteStage='idle';setStatus('Winieta gotowa','');return}if(watermarkStage==='loading')return;if(watermarkStage!=='idle')return;setStatus('Gotowe','');return}if(typeof e.data!=='string')return;if(e.data.indexOf('KTX_WM_OPEN|')===0&&watermarkStage==='loading'){if(parseInt(e.data.substring(12),10)===watermarkBeforeDocs+1)finishWatermark();return}if(e.data.indexOf('KTX_WM_TARGET|')===0&&watermarkStage==='capturing'){var p=e.data.split('|');watermarkTargetIndex=parseInt(p[1],10);watermarkBeforeDocs=parseInt(p[2],10);watermarkTargetName=p.slice(3).join('|');openWatermarkDocument();return}if(e.data.indexOf('KTX_OK|')===0){if(e.data.indexOf('Winieta gotowa')>0)vignetteStage='idle';if(e.data.indexOf('Watermark gotowy')>0)watermarkStage='idle';setStatus(e.data.substring(7),'');return}if(e.data.indexOf('KTX_ERR|')===0){vignetteStage='idle';watermarkStage='idle';setStatus('Błąd — '+e.data.substring(8),'err')}});</script></body></html>
